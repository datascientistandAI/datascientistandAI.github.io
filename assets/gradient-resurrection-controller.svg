<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" role="img" aria-labelledby="title desc">
  <title id="title">Gradient Resurrection: Continual Learning Controller</title>
  <desc id="desc">A trust-scaled continual-learning controller combines a safe-gradient projection with an active preservation force from past-task memory. A formal local-validity bound supports at-most-linear forgetting, while benchmark evaluation covers linear checks, Split and Permuted-MNIST, a four-dataset mixture, and task-conflict scenarios. A compositional factorization extension hypothesis failed cleanly.</desc>

  <defs>
    <linearGradient id="canvasGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1624"/>
      <stop offset="0.55" stop-color="#090d15"/>
      <stop offset="1" stop-color="#0b0a14"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98ad"/>
    </marker>
    <marker id="arrowContext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowEvidence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f2c66d"/>
    </marker>
    <marker id="arrowFailed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b9c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2400" height="1200" rx="28" fill="url(#canvasGlow)" stroke="#263044" stroke-width="2"/>
  <rect x="1" y="1" width="2398" height="1198" rx="27" fill="url(#grid)"/>

  <text x="56" y="58" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="800" letter-spacing="2">GRADIENT RESURRECTION</text>
  <text x="56" y="92" fill="#7dd3fc" font-family="Fira Code, ui-monospace, monospace" font-size="14" letter-spacing="1.5">CONTINUAL LEARNING CONTROLLER · PROOF → EVIDENCE → HONEST FAILURE</text>

  <rect x="1450" y="42" width="18" height="18" rx="5" fill="#162c46" stroke="#38bdf8" stroke-width="2"/>
  <text x="1478" y="57" fill="#dbeafe" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">CONTROLLER</text>
  <rect x="1588" y="42" width="18" height="18" rx="5" fill="#2a1f08" stroke="#f2c66d" stroke-width="2"/>
  <text x="1616" y="57" fill="#fef3c7" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">EVIDENCE</text>
  <rect x="1730" y="42" width="18" height="18" rx="5" fill="#351d25" stroke="#ff7b9c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1758" y="57" fill="#fecdd3" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">FAILED EXTENSION</text>

  <text x="56" y="170" fill="#7c8aa1" font-family="Fira Code, ui-monospace, monospace" font-size="12" letter-spacing="1.3">CORE CONTROLLER</text>
  <text x="1050" y="170" fill="#7c8aa1" font-family="Fira Code, ui-monospace, monospace" font-size="12" letter-spacing="1.3">FORMAL GUARANTEE</text>
  <text x="1050" y="650" fill="#7c8aa1" font-family="Fira Code, ui-monospace, monospace" font-size="12" letter-spacing="1.3">EMPIRICAL EVALUATION</text>
  <text x="1050" y="920" fill="#7c8aa1" font-family="Fira Code, ui-monospace, monospace" font-size="12" letter-spacing="1.3">EXTENSION HYPOTHESIS</text>

  <!-- Core controller flow -->
  <path d="M 290 370 H 350" fill="none" stroke="#8b98ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 610 370 H 690" fill="none" stroke="#8b98ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 950 370 H 1030" fill="none" stroke="#8b98ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1290 370 H 1370" fill="none" stroke="#8b98ad" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 470 250 C 590 250, 620 275, 690 300" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrowContext)"/>
  <path d="M 820 250 C 820 270, 820 280, 820 300" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrowContext)"/>

  <g filter="url(#nodeGlow)">
    <rect x="55" y="320" width="235" height="100" rx="14" fill="#162c46" stroke="#38bdf8" stroke-width="3"/>
    <rect x="350" y="320" width="260" height="100" rx="14" fill="#162c46" stroke="#38bdf8" stroke-width="3"/>
    <rect x="690" y="320" width="260" height="100" rx="14" fill="#162c46" stroke="#38bdf8" stroke-width="3"/>
    <rect x="1030" y="320" width="260" height="100" rx="14" fill="#162c46" stroke="#38bdf8" stroke-width="3"/>
    <rect x="1370" y="320" width="260" height="100" rx="50" fill="#12352f" stroke="#34d399" stroke-width="3"/>
    <rect x="350" y="200" width="260" height="100" rx="14" fill="#241d4d" stroke="#a78bfa" stroke-width="3"/>
    <rect x="690" y="200" width="260" height="100" rx="14" fill="#241d4d" stroke="#a78bfa" stroke-width="3"/>
  </g>

  <g fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="172" y="365"><tspan x="172" dy="0">CURRENT TASK</tspan><tspan x="172" dy="22">GRADIENT gₜ</tspan></text>
    <text x="480" y="365"><tspan x="480" dy="0">SAFE-GRADIENT</tspan><tspan x="480" dy="22">PROJECTION</tspan></text>
    <text x="820" y="365"><tspan x="820" dy="0">TRUST-SCALED</tspan><tspan x="820" dy="22">CONTROLLER</tspan></text>
    <text x="1160" y="365"><tspan x="1160" dy="0">PARAMETER</tspan><tspan x="1160" dy="22">UPDATE</tspan></text>
    <text x="1500" y="365"><tspan x="1500" dy="0">CONTINUAL-LEARNING</tspan><tspan x="1500" dy="22">RETENTION</tspan></text>
    <text x="480" y="245"><tspan x="480" dy="0">PAST-TASK GRADIENTS</tspan><tspan x="480" dy="22">/ REFERENCE MEMORY</tspan></text>
    <text x="820" y="245"><tspan x="820" dy="0">ACTIVE</tspan><tspan x="820" dy="22">PRESERVATION FORCE</tspan></text>
  </g>

  <!-- Formal guarantee branch -->
  <path d="M 820 300 C 820 220, 1050 220, 1050 220 H 1110" fill="none" stroke="#65e6a3" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1370 220 H 1430" fill="none" stroke="#65e6a3" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1110" y="170" width="260" height="100" rx="14" fill="#18352c" stroke="#65e6a3" stroke-width="3"/>
  <rect x="1430" y="170" width="330" height="100" rx="14" fill="#18352c" stroke="#65e6a3" stroke-width="3"/>
  <g fill="#ecfdf5" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="1240" y="215"><tspan x="1240" dy="0">FORMAL LOCAL-</tspan><tspan x="1240" dy="21">VALIDITY BOUND</tspan></text>
    <text x="1595" y="215"><tspan x="1595" dy="0">FORGETTING ACCUMULATES</tspan><tspan x="1595" dy="21">AT MOST LINEARLY</tspan></text>
  </g>
  <text x="1260" y="295" fill="#a7f3d0" font-family="Fira Code, ui-monospace, monospace" font-size="12" text-anchor="middle">while the controller remains locally valid</text>

  <!-- Evidence branch -->
  <path d="M 950 420 C 1030 520, 1040 560, 1110 700" fill="none" stroke="#f2c66d" stroke-width="3" marker-end="url(#arrowEvidence)"/>
  <rect x="1110" y="680" width="260" height="100" rx="14" fill="#2a1f08" stroke="#f2c66d" stroke-width="3"/>
  <g fill="#fef3c7" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="1240" y="725"><tspan x="1240" dy="0">EMPIRICAL</tspan><tspan x="1240" dy="22">EVALUATION</tspan></text>
  </g>
  <path d="M 1370 730 H 1430" fill="none" stroke="#f2c66d" stroke-width="2.5" marker-end="url(#arrowEvidence)"/>
  <g fill="#2a1f08" stroke="#f2c66d" stroke-width="2">
    <rect x="1430" y="610" width="280" height="66" rx="12"/>
    <rect x="1430" y="690" width="280" height="66" rx="12"/>
    <rect x="1430" y="770" width="280" height="66" rx="12"/>
    <rect x="1430" y="850" width="280" height="66" rx="12"/>
  </g>
  <g fill="#fff7ed" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="1570" y="650">LINEAR SANITY CHECKS</text>
    <text x="1570" y="730">SPLIT / PERMUTED-MNIST</text>
    <text x="1570" y="810">4-DATASET MIXTURE</text>
    <text x="1570" y="890">TASK-CONFLICT SCENARIOS</text>
  </g>

  <!-- Failed extension branch -->
  <path d="M 950 420 C 1010 500, 1030 850, 1110 970" fill="none" stroke="#ff7b9c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowFailed)"/>
  <rect x="1110" y="930" width="330" height="100" rx="14" fill="#351d25" stroke="#ff7b9c" stroke-width="3" stroke-dasharray="10 7"/>
  <path d="M 1440 980 H 1500" fill="none" stroke="#ff7b9c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowFailed)"/>
  <rect x="1500" y="930" width="260" height="100" rx="14" fill="#351d25" stroke="#ff7b9c" stroke-width="3" stroke-dasharray="10 7"/>
  <path d="M 1760 980 H 1820" fill="none" stroke="#ff7b9c" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowFailed)"/>
  <rect x="1820" y="900" width="410" height="160" rx="14" fill="#451b29" stroke="#ff4f7b" stroke-width="4" stroke-dasharray="12 8"/>
  <g fill="#ffe4e6" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="1275" y="975"><tspan x="1275" dy="0">EXTENSION HYPOTHESIS</tspan><tspan x="1275" dy="22">COMPOSITIONAL FACTORIZATION</tspan><tspan x="1275" dy="22">ACROSS TASKS</tspan></text>
    <text x="1630" y="975"><tspan x="1630" dy="0">FACTORIZATION</tspan><tspan x="1630" dy="22">TEST</tspan></text>
    <text x="2025" y="957"><tspan x="2025" dy="0">FAILED CLEANLY</tspan><tspan x="2025" dy="24">BEHAVIOR DID NOT</tspan><tspan x="2025" dy="24">FACTORIZE COMPOSITIONALLY</tspan></text>
  </g>
  <text x="2025" y="1090" text-anchor="middle" fill="#fda4af" font-family="Fira Code, ui-monospace, monospace" font-size="12">PUBLISHED AS OBSERVED · NOT TRIMMED OUT</text>

  <line x1="56" y1="1125" x2="2344" y2="1125" stroke="#263044" stroke-width="1"/>
  <text x="1200" y="1165" text-anchor="middle" fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="600">A trust-scaled preservation force works alongside safe-gradient projection; the local-validity proof and benchmark results are reported together with the failed extension.</text>
</svg>
